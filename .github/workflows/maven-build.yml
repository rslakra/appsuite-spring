name: Build Maven Package

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (Units & Integrations)
    runs-on: ubuntu-latest
    env:
      # version used to build/install appsuite-core locally and consumed by this project
      CORE_VERSION: '0.0.0-LOCAL'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Checkout appsuite-core (dependency) into ./appsuite-core
      - name: Checkout appsuite-core
        uses: actions/checkout@v4
        with:
          repository: rslakra/appsuite-core
          path: appsuite-core

      # Build and install appsuite-core into the local maven repository
      - name: Build & Install appsuite-core
        working-directory: appsuite-core
        run: mvn -B clean install -DskipTests -Drevision=$CORE_VERSION

      - name: Build & Verify
        run: mvn -B clean verify -Dappsuite-core.version=$CORE_VERSION
